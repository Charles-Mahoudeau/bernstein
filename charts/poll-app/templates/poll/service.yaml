apiVersion: v1
kind: Service
metadata:
  name: {{ include "poll-app.poll.fullname" . }}
  labels:
    {{- include "poll-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: poll
  {{- if .Values.traefik.resilience.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "poll-app.traefik.transportName" .) }}
  {{- end }}
spec:
  selector:
    {{- include "poll-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: poll
  ports:
    - port: {{ .Values.poll.service.port }}
      targetPort: http
  type: ClusterIP
