apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poll-app.poll.fullname" . }}
  labels:
    {{- include "poll-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: poll
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: {{ .Values.poll.replicas }}
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: poll
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: poll
    spec:
      {{- with .Values.secrets.registry.name }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "poll-app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: poll
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: {{ include "poll-app.poll.fullname" . }}
          image: "{{ with .Values.registry.url | trimSuffix "/" }}{{ . }}/{{ end }}{{ .Values.poll.image.repository }}:{{ .Values.poll.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.poll.image.pullPolicy }}
          {{- with .Values.poll.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: {{ include "poll-app.redis.fullname" . | quote }}
          {{- if .Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.secretName }}
                  key: {{ .Values.redis.auth.passwordKey }}
          {{- end }}
          {{- with .Values.poll.probe.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.poll.probe.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      restartPolicy: Always
