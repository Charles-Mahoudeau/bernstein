apiVersion: v1
kind: Service
metadata:
  name: {{ include "poll-app.result.fullname" . }}
  labels:
    {{- include "poll-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: result
  {{- if or .Values.result.service.stickyCookie .Values.traefik.resilience.enabled }}
  annotations:
    {{- if .Values.result.service.stickyCookie }}
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    {{- end }}
    {{- if .Values.traefik.resilience.enabled }}
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "poll-app.traefik.transportName" .) }}
    {{- end }}
  {{- end }}
spec:
  selector:
    {{- include "poll-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: result
  ports:
    - port: {{ .Values.result.service.port }}
      targetPort: http
  type: ClusterIP
