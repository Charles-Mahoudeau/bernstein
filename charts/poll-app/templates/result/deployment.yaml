apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poll-app.result.fullname" . }}
  labels:
    {{- include "poll-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: result
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- if not .Values.result.autoscaling.enabled }}
  replicas: {{ .Values.result.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: result
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: result
    spec:
      {{- with .Values.secrets.registry.name }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "poll-app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: result
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: {{ include "poll-app.result.fullname" . }}
          image: "{{ with .Values.registry.url | trimSuffix "/" }}{{ . }}/{{ end }}{{ .Values.result.image.repository }}:{{ .Values.result.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.result.image.pullPolicy }}
          {{- with .Values.result.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: {{ include "poll-app.postgres.fullname" . | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.secretName }}
                  key: {{ .Values.postgres.auth.userKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.secretName }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.secretName }}
                  key: {{ .Values.postgres.auth.dbKey }}
          {{- with .Values.result.probe.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.result.probe.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      restartPolicy: Always
