apiVersion: v1
kind: Service
metadata:
  name: {{ include "poll-app.redis.fullname" . }}
  labels:
    {{- include "poll-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "poll-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: redis
  type: ClusterIP
