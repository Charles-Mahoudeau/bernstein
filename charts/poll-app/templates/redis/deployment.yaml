apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poll-app.redis.fullname" . }}
  labels:
    {{- include "poll-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: {{ include "poll-app.redis.fullname" . }}
        image: {{ .Values.redis.containerImage }}
        ports:
          - name: redis
            containerPort: {{ .Values.redis.port }}
        readinessProbe:
          exec:
            command: [ "redis-cli", "-e", "ping" ]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec:
            command: [ "redis-cli", "-e", "ping" ]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        {{- with .Values.redis.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.redis.auth.enabled }}
        args: [ "--requirepass", "$(REDIS_PASSWORD)" ]
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.redis.auth.secretName }}
                key: {{ .Values.redis.auth.passwordKey }}
          - name: REDISCLI_AUTH
            valueFrom:
              secretKeyRef:
                name: {{ .Values.redis.auth.secretName }}
                key: {{ .Values.redis.auth.passwordKey }}
        {{- end }}
