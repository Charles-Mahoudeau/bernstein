# Naming contract (shared by every template):
#   release:   poll-app (helm install poll-app ... --namespace poll)
#   namespace: poll
# Release and namespace are helm arguments, not values: templates read them
# with .Release.Name and .Release.Namespace.

registry:
  url: ""
  auth:
    secretName: ""

secrets:
  # Optional: don't use it if AKS have ACR attached
  registry:
    name: ""

# Namespace safety net: applies to any container that declares no resources,
# and rejects containers asking for more than max. Every workload below sets
# its own resources, so this only catches future additions.
limitRange:
  defaultRequest:
    cpu: 50m
    memory: 64Mi
  default:
    memory: 128Mi
  max:
    cpu: "1"
    memory: 1Gi

# Redis and Postgres are single instances: without them votes or results stop.
# When one node is left (drain, node failure), its CPU requests are nearly full
# and Postgres stayed Pending (issue #42). A higher priority lets the scheduler
# evict a replica of poll, result or worker instead, which have a second one.
backendPriority:
  enabled: true
  value: 1000 # Above the default 0 of the other pods, far below system-*-critical

# Traefik talks to pod IPs taken from the Service endpoints. When a node dies,
# its pods stay in the endpoints until the node is declared NotReady (about
# 40s + propagation), so requests sent to them hang for the dial timeout
# (30s by default). A short dial timeout plus a retry on another pod turns that
# into a short delay. Needs the Traefik CRDs (installed with the Traefik chart).
traefik:
  resilience:
    enabled: true
    dialTimeout: 2s
    retry:
      attempts: 3
      initialInterval: 100ms # Doubles at each attempt

poll:
  replicas: 2 # Ignored when autoscaling.enabled: the HPA owns the replica count
  autoscaling:
    enabled: true
    minReplicas: 2 # Not below 2: the PodDisruptionBudget needs a second pod
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70 # Of the CPU request below
    scaleDownStabilizationSeconds: 120
  resources:
    requests:
      cpu: 250m # The HPA target is a share of this value
      memory: 96Mi
    limits:
      memory: 192Mi
  image:
    repository: poll
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  # Passed to gunicorn as GUNICORN_CMD_ARGS. With the default sync worker, one
  # request at a time is served and /healthz waits behind queued votes.
  # Threads rather than workers: each worker is a full Python process, and one
  # process already covers the CPU request above
  gunicorn:
    args: "--worker-class gthread --threads 4"
  ingress:
    enabled: false
    className: traefik
    host: "" # Empty = match any host
  probe:
    # More lenient than readiness: an overloaded pod must first leave the
    # Service, and only be restarted if it stays stuck (about 1 minute)
    liveness:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

worker:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  image:
    repository: worker
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  probe:
    # Covers the JVM startup (up to 2 minutes). It must stay on /healthz:
    # a failure kills the container, so it must not depend on Redis or PostgreSQL
    startup:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      failureThreshold: 24
    # On /readyz on purpose: the worker opens its PostgreSQL connection only at
    # startup and never reopens it, so after a PostgreSQL restart only a container
    # restart fixes it. About 1 minute of failures before the restart
    liveness:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 10
      timeoutSeconds: 3 # /readyz checks Redis then PostgreSQL: 1s is too short
      failureThreshold: 6
    # The worker has no Service, so a short period costs nothing and shows a
    # broken worker within 15s
    readiness:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

result:
  replicas: 2 # Ignored when autoscaling.enabled: the HPA owns the replica count
  autoscaling:
    enabled: true
    minReplicas: 2 # Not below 2: the PodDisruptionBudget needs a second pod
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70 # Of the CPU request below
    scaleDownStabilizationSeconds: 120
  resources:
    requests:
      cpu: 100m # The HPA target is a share of this value
      memory: 128Mi
    limits:
      memory: 256Mi
  image:
    repository: result
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
    # Traefik pins each browser to one pod with a cookie. The page uses
    # Socket.IO long-polling, whose requests fail on another pod ("Session ID
    # unknown"), so without this 2 replicas break the live tally.
    stickyCookie: true
  ingress:
    enabled: true
    className: traefik
    host: "" # Empty = match any host
  probe:
    liveness:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    # Short period: /readyz is one SELECT 1. After a PostgreSQL restart the pods
    # come back Ready at the next probe, so a 10s period added up to 10s of 503s
    readiness:
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 3
      timeoutSeconds: 2
      failureThreshold: 3

redis:
  replicas: 1 # Should not be an other value than 1
  containerImage: redis:8.10.2-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  auth:
    enabled: false
    secretName: redis-secret
    passwordKey: REDIS_PASSWORD

postgres:
  replicas: 1 # Single instance: each replica would have its own data
  image: postgres:18.6-alpine
  port: 5432
  storage:
    size: 1Gi
  resources: # requests = limits, so the pod is Guaranteed QoS and evicted last
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # Secret created by the deploy script, not by the chart
  auth:
    secretName: postgres-secret
    passwordKey: POSTGRES_PASSWORD
    userKey: POSTGRES_USER
    dbKey: POSTGRES_DB
