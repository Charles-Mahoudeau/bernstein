# Naming contract (shared by every template):
#   release:   poll-app (helm install poll-app ... --namespace poll)
#   namespace: poll
# Release and namespace are helm arguments, not values: templates read them
# with .Release.Name and .Release.Namespace.

registry:
  url: ""
  auth:
    secretName: ""

secrets:
  # Optional: don't use it if AKS have ACR attached
  registry:
    name: ""

poll:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  image:
    repository: poll
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: "" # Empty = match any host
  probe:
    liveness:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3

worker:
  replicas: 1

result:
  replicas: 1

redis:
  replicas: 1 # Should not be an other value than 1
  containerImage: redis:8.10.2-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  auth:
    enabled: false
    secretName: redis-secret
    passwordKey: REDIS_PASSWORD

postgres:
  replicas: 1 # Single instance: each replica would have its own data
  image: postgres:18.6-alpine
  port: 5432
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Secret created by the deploy script, not by the chart
  auth:
    secretName: postgres-secret
    passwordKey: POSTGRES_PASSWORD
    userKey: POSTGRES_USER
    dbKey: POSTGRES_DB
