# Overrides for the official Traefik chart (traefik/traefik), passed by
# `bernstein traefik install`. Only the keys that differ from the chart
# defaults are listed: `helm show values traefik/traefik` shows the rest.

deployment:
  replicas: 2

# Spread the replicas over the nodes. DoNotSchedule rather than ScheduleAnyway:
# two Traefik pods on one node would both be lost with it. The cost: during a
# drain the evicted pod stays Pending until the node is back, and the PDB below
# keeps the other one running.
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
    # Only the pods of the same revision count, so a rollout spreads the new
    # pods instead of being balanced against the old ones
    matchLabelKeys:
      - pod-template-hash
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# A drain never evicts the last running Traefik
podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  spec:
    externalTrafficPolicy: Cluster
