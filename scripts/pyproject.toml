[project]
name = "bernstein"
version = "0.1.0"
description = "Deployment, release and availability-testing CLI for the Bernstein poll app on AKS"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "python-socketio[client]>=5.17.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
bernstein = "bernstein.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bernstein"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N", "C4", "PTH", "RET", "TC"]
ignore = [
    "PLR0913", # CLI commands naturally take many options
    "PLR2004", # magic values: HTTP codes, thresholds
    "PLR0912",
    "PLR0915",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["bernstein"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Typer reads parameters positionally and needs annotation types at runtime.
"src/bernstein/cli.py" = ["PLR0917", "TC"]
